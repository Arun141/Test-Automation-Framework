name: Test Automation WorkFlow

on:
  schedule:
  - cron: 00 18 * * *
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Running Test Automation Framework with Maven
      run: mvn test -X -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=false

    - name: Upload Test logs
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: Test logs
        path: logs/

    - name: Upload Screenshots as Artifacts
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: screenshots
        path: screenshots/
        if-no-files-found: ignore

    - name: Upload HTML Report as Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
         name: html-report
         path: report.html

    - name: Test Execution Status
      run: echo "Test Execution Completed"

    - name: Copy Report to gh-pages Folder
      if: always()
      run: |
        mkdir -p public/extent-reports
        cp -R report.html public/extent-reports/
        if [ -d screenshots]; then
          cp -R screenshots public/extent-reports/report-screenshots
          sed -i 's#\./screenshots/#./report-screenshots/#g' public/extent-reports/report.html
        else
          echo "No screenshots folder found, skipping"
        fi

    - name: Deploy
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4.8.0
      with:
          folder: public/extent-reports/
          token: ${{ secrets.PAT123 }}
          clean: true
